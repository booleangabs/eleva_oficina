<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Eleva Oficina</title>
<style>
:root{--bg:#eef6ff;--tx:#12324f;--a:#ff7a1a;--b:#2f80ed;box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1b2a;--tx:#e8f1fb}}
:root[data-theme=dark]{--bg:#0f1b2a;--tx:#e8f1fb}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:16px;box-sizing:border-box;text-align:center}
h1{margin:0;font-size:clamp(1.8rem,5vw,3rem)}
.g{display:flex;flex-wrap:wrap;gap:20px;justify-content:center;width:100%;max-width:900px}
a{flex:1 1 300px;min-height:260px;border-radius:32px;color:#fff;text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:clamp(1.5rem,4vw,2.2rem);font-weight:700;box-shadow:0 6px 0 #0003}
a span{font-size:5rem}a small{font-size:1rem;font-weight:500;opacity:.9}
a:active{transform:translateY(3px)}
</style></head><body>
<h1>Bem-vindo(a) à oficina! 👋</h1>
<div class="g">
<a href="robot_arm/" style="background:var(--a)"><span>🦾</span>Braço Robótico<small>Fundamental II</small></a>
<a href="prompt/" style="background:var(--b)"><span>🤖</span>Conversando com a IA<small>Fundamental II</small></a>
</div>
</body></html>
